name: Build MangaShelf Android app

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MangaShelf.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MangaShelf-apk
          path: MangaShelf.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mangashelf-android
          name: MangaShelf for Android
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Open this page on your Android phone and tap **MangaShelf.apk** to download it.
            Then open the file and allow "Install unknown apps" if Android asks.
            Built from commit ${{ github.sha }}.
          files: MangaShelf.apk
